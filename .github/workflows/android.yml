name: Android CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Pruebas y APK release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # La clave de firma viaja cifrada en el repositorio (keystore/radillo-release.jks.enc) y se
      # descifra con el secreto RADILLO_KEYSTORE_PASSWORD. Sin el secreto, el release se firma con
      # la clave de depuración (instalable, pero no actualizable sobre una firma real).
      - name: Clave de firma
        id: signing
        shell: bash
        env:
          RADILLO_KEYSTORE_PASSWORD: ${{ secrets.RADILLO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RADILLO_KEYSTORE_PASSWORD" ] && [ -f keystore/radillo-release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in keystore/radillo-release.jks.enc \
              -out "$RUNNER_TEMP/radillo-release.jks" -pass env:RADILLO_KEYSTORE_PASSWORD
            echo "RADILLO_KEYSTORE_PATH=$RUNNER_TEMP/radillo-release.jks" >> "$GITHUB_ENV"
            echo "RADILLO_KEY_ALIAS=radillo" >> "$GITHUB_ENV"
            echo "mode=propia" >> "$GITHUB_OUTPUT"
          else
            echo "mode=temporal (debug)" >> "$GITHUB_OUTPUT"
          fi

      - name: Pruebas unitarias y APK release
        shell: bash
        env:
          RADILLO_KEYSTORE_PASSWORD: ${{ secrets.RADILLO_KEYSTORE_PASSWORD }}
          RADILLO_KEY_PASSWORD: ${{ secrets.RADILLO_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RadilloPlayerWave-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7

      # Si la compilación falla, deja el extracto relevante del registro como comentario
      # del commit, para poder diagnosticarlo desde la API sin abrir la interfaz web.
      - name: Comentar el error en el commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Android CI: fallo en la ejecución ${{ github.run_id }}"
            echo
            echo '```'
            grep -n -E "FAILURE|What went wrong|Could not|error:|^e: |Unresolved|Caused by|not found|Execution failed|BUILD FAILED|Error:|lint" build.log | grep -v "^\s*at " | head -120
            echo
            echo "----- últimas 60 líneas -----"
            tail -n 60 build.log
            echo '```'
          } > comment.md
          head -c 60000 comment.md > comment_trim.md
          jq -Rs '{body: .}' comment_trim.md | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input -

      # Resumen verificable (pruebas por módulo, tamaño del APK, firma) en el resumen del job
      # y como comentario del commit, consultable por la API sin descargar artefactos.
      - name: Resumen de pruebas y APK
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          {
            echo "### Android CI: ejecución ${{ github.run_id }} correcta"
            echo
            echo "| Módulo | Pruebas | Fallos | Errores | Omitidas |"
            echo "|---|---:|---:|---:|---:|"
            for module in app core data player visualizer; do
              dir="$module/build/test-results"
              [ -d "$dir" ] || continue
              python3 - "$module" "$dir" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          module, d = sys.argv[1], sys.argv[2]
          t = f = e = s = 0
          for path in glob.glob(f"{d}/**/TEST-*.xml", recursive=True):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"| {module} | {t} | {f} | {e} | {s} |")
          PY
            done
            echo
            for apk in app/build/outputs/apk/release/*.apk; do
              echo "- APK release: \`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)"
            done
            echo "- versionName: $(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)"
            echo "- Firma: $SIGNING_MODE"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          jq -Rs '{body: .}' summary.md | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input -

      # Liga fija de descarga: cada push a main publica (o reemplaza) la release v<versionName>
      # con el APK, de modo que .../releases/latest/download/RadilloPlayerWave.apk apunta siempre
      # a la última compilación.
      - name: Publicar APK en Releases
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v$VERSION"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p release
          cp "$APK" "release/RadilloPlayerWave-$VERSION.apk"
          cp "$APK" "release/RadilloPlayerWave.apk"
          {
            echo "Compilación automática del commit ${{ github.sha }} (Android CI, ejecución ${{ github.run_id }})."
            echo
            echo "**Instalación:** descarga \`RadilloPlayerWave.apk\`, ábrelo en el dispositivo y acepta la"
            echo "instalación desde origen desconocido. Compilación release (optimizada con R8). Firma: $SIGNING_MODE."
            echo
            cat summary.md
          } > notes.md
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create "$TAG" release/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "RadilloPlayerWave $VERSION" \
            --notes-file notes.md \
            --latest

      # Solo se conserva la última versión publicada: así nadie descarga un APK antiguo por error.
      - name: Borrar versiones anteriores
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          KEEP="v$VERSION"
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$KEEP" ]; then
              echo "Borrando $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            fi
          done
          # Etiquetas sueltas sin release (de compilaciones antiguas).
          git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$KEEP" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
            fi
          done
