name: Android CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK debug y ejecutar pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias y APK debug
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RadilloPlayerWave-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7

      # Resumen verificable (pruebas por módulo y tamaño del APK) en el resumen del job
      # y como comentario del commit, consultable por la API sin descargar artefactos.
      - name: Resumen de pruebas y APK
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Android CI: ejecución ${{ github.run_id }} correcta"
            echo
            echo "| Módulo | Pruebas | Fallos | Errores | Omitidas |"
            echo "|---|---:|---:|---:|---:|"
            for module in app core data player visualizer; do
              dir="$module/build/test-results"
              [ -d "$dir" ] || continue
              python3 - "$module" "$dir" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          module, d = sys.argv[1], sys.argv[2]
          t = f = e = s = 0
          for path in glob.glob(f"{d}/**/TEST-*.xml", recursive=True):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"| {module} | {t} | {f} | {e} | {s} |")
          PY
            done
            echo
            for apk in app/build/outputs/apk/debug/*.apk; do
              echo "- APK: \`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)"
            done
            echo "- versionName: $(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          jq -Rs '{body: .}' summary.md | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input -

      # Si la compilación falla, deja el extracto relevante del registro como comentario
      # del commit, para poder diagnosticarlo desde la API sin abrir la interfaz web.
      - name: Comentar el error en el commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Android CI: fallo en la ejecución ${{ github.run_id }}"
            echo
            echo '```'
            grep -n -E "FAILURE|What went wrong|Could not|error:|^e: |Unresolved|Caused by|not found|Execution failed|BUILD FAILED" build.log | head -80
            echo
            echo "----- últimas 120 líneas -----"
            tail -n 120 build.log
            echo '```'
          } > comment.md
          # Límite de 65 536 caracteres por comentario.
          head -c 60000 comment.md > comment_trim.md
          jq -Rs '{body: .}' comment_trim.md | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input -
