# Memoria para el demonio de Gradle (Compose + KSP + Hilt la necesitan).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX es obligatorio para Jetpack.
android.useAndroidX=true

# Genera R classes solo con recursos propios de cada módulo (builds más rápidas).
android.nonTransitiveRClass=true

kotlin.code.style=official
